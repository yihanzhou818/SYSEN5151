name: Verify and publish StockLens
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stocklens-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import reviewed source package once
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -f stocklens-source.zip ]; then
            echo '9ddc24eed4cb9d67ea0fc98d444740ff88bbefbb390756016089cdf69e1414b6  stocklens-source.zip' | sha256sum -c -
            unzip -o stocklens-source.zip -x '.github/*'
          fi
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/site.test.mjs
      - name: Save verified source directories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -f stocklens-source.zip ]; then
            git rm stocklens-source.zip
            git add .gitignore README.md ai_model_service backend dashboard_ui docs frontend market_data_provider news_provider prompt-log requirements stocklens_system tests website
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import verified StockLens website and walking skeleton'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
